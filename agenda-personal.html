
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Agenda do Personal | FitCoach</title>

  <link rel="stylesheet" href="aluno.css">
  <link rel="stylesheet" href="agenda.css">
</head>

<body>
  <main class="app">

    <header class="topo">
      <div>
        <p>Área do Personal</p>
        <h1>Agenda</h1>
      </div>

      <button onclick="voltar()" class="btn-sair">
        Voltar
      </button>
    </header>

    <section class="card">
      <h2>Novo horário</h2>

      <form id="formHorario" class="agenda-form">

        <label for="dataHorario">Data</label>
        <input type="date" id="dataHorario" required>

        <label for="horaHorario">Hora</label>
        <input type="time" id="horaHorario" required>

        <button type="submit">
          Criar horário
        </button>

      </form>
    </section>

    <section class="card agenda-secao">
      <h2>Minha agenda</h2>

      <div id="listaAgenda" class="agenda-lista">
        <p>Carregando...</p>
      </div>
    </section>

  </main>

  <script type="module" src="agenda-personal.js"></script>
</body>
</html>
